<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Приложение</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap">
<style>
  :root {
    --bg: #eef2f3; --surface: #ffffff; --ink: #14232b; --ink-2: #566871; --line: #d5dee0;
    --accent: #0e6b63; --accent-soft: #d6ece8;
    --font-body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-display: "Unbounded", "Onest", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1a1f; --surface: #172730; --ink: #e8f0f1; --ink-2: #93a9b1; --line: #27404b;
      --accent: #4cc9b8; --accent-soft: #163b3a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1a1f; --surface: #172730; --ink: #e8f0f1; --ink-2: #93a9b1; --line: #27404b;
    --accent: #4cc9b8; --accent-soft: #163b3a;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--font-body); font-size: 15px; line-height: 1.45;
    padding: 28px 16px 32px;
  }
  main { max-width: 420px; margin-inline: auto; display: flex; flex-direction: column; gap: 22px; }
  .eyebrow { color: var(--ink-2); font-size: 13px; letter-spacing: .04em; text-transform: uppercase; }
  h1 { margin: 2px 0 0; font-family: var(--font-display); font-weight: 500; font-size: 24px; line-height: 1.2; text-wrap: balance; }
  .links { display: flex; flex-direction: column; gap: 12px; }
  a.link {
    display: flex; align-items: center; gap: 16px; padding: 18px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
    color: inherit; text-decoration: none;
    transition: border-color .12s ease, transform .12s ease;
  }
  a.link:hover { border-color: var(--accent); }
  a.link:active { transform: scale(.99); }
  a.link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .glyph { flex: none; width: 48px; height: 48px; border-radius: 14px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
  .glyph svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .t { font-weight: 600; font-size: 17px; }
  .s { font-size: 13px; color: var(--ink-2); }
  .chev { margin-left: auto; color: var(--ink-2); font-size: 22px; }
  @media (prefers-reduced-motion: reduce) { a.link { transition: none; } }
</style>
</head>
<body>
<main>
  <div>
    <div class="eyebrow">Софья Поленова</div>
    <h1>Приложение</h1>
  </div>
  <div class="links">
    <a class="link" id="prices" href="https://www.sofiapolenova.com/#services">
      <span class="glyph"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18"/><path d="M16.5 7.5c-.7-1.4-2.3-2-4.5-2-2.6 0-4.2 1.2-4.2 3 0 4.4 8.9 2 8.9 6.4 0 1.8-1.7 3.1-4.7 3.1-2.3 0-4.1-.8-4.9-2.3"/></svg></span>
      <span><div class="t">Цены и форматы</div></span>
      <span class="chev">›</span>
    </a>
    <a class="link" id="cabinet" href="/kabinet-demo?from=app">
      <span class="glyph"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.6-3.6 3.4-5.5 7-5.5s6.4 1.9 7 5.5"/></svg></span>
      <span><div class="t">Личный кабинет</div><div class="s">Абонемент, занятия, продление</div></span>
      <span class="chev">›</span>
    </a>
  </div>
</main>
<script>
(function () {
  var cab = document.getElementById('cabinet');
  cab.href = '/kabinet-demo' + (location.search ? location.search + '&from=app' : '?from=app');
  var tg = window.Telegram && window.Telegram.WebApp;
  if (!tg || !tg.initData) return;
  try { tg.ready(); tg.expand(); } catch (e) {}
  if (tg.colorScheme) document.documentElement.setAttribute('data-theme', tg.colorScheme);
  // Цены открываем встроенным браузером Telegram — из него легко вернуться сюда
  document.getElementById('prices').addEventListener('click', function (e) {
    e.preventDefault();
    tg.openLink(this.href);
  });
})();
</script>
</body>
</html>
