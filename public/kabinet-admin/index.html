<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Клиенты</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap">
<style>
  :root {
    --bg: #eef2f3; --surface: #ffffff; --surface-2: #e4ebec; --ink: #14232b; --ink-2: #566871; --line: #d5dee0;
    --accent: #0e6b63; --accent-ink: #ffffff; --accent-soft: #d6ece8; --used: #c2cfd2; --warn: #9a5b00; --warn-soft: #fbecd0;
    --bad: #a3322b; --bad-soft: #f8dcd9;
    --font-body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-display: "Unbounded", "Onest", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1a1f; --surface: #172730; --surface-2: #1f343e; --ink: #e8f0f1; --ink-2: #93a9b1; --line: #27404b;
      --accent: #4cc9b8; --accent-ink: #062521; --accent-soft: #163b3a; --used: #35505b; --warn: #f0b95a; --warn-soft: #3a2f16;
      --bad: #f19a92; --bad-soft: #43201d;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1a1f; --surface: #172730; --surface-2: #1f343e; --ink: #e8f0f1; --ink-2: #93a9b1; --line: #27404b;
    --accent: #4cc9b8; --accent-ink: #062521; --accent-soft: #163b3a; --used: #35505b; --warn: #f0b95a; --warn-soft: #3a2f16;
    --bad: #f19a92; --bad-soft: #43201d;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; padding: 24px 16px 40px; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  main { max-width: 480px; margin-inline: auto; display: flex; flex-direction: column; gap: 26px; }
  .eyebrow { color: var(--ink-2); font-size: 13px; letter-spacing: .04em; text-transform: uppercase; }
  h1 { margin: 2px 0 0; font-family: var(--font-display); font-weight: 500; font-size: 26px; line-height: 1.2; }
  .stamp { color: var(--ink-2); font-size: 14px; margin-top: 4px; }
  .sum { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 14px; }
  .sum b { font-variant-numeric: tabular-nums; }
  h2 { margin: 0 0 8px; font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); }
  h2 .cnt { color: var(--ink); }

  .list { background: var(--surface); border-radius: 16px; overflow: hidden; }
  .empty { padding: 16px; color: var(--ink-2); }

  /* сегодня */
  .lesson { display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 12px; padding: 14px 16px; }
  .lesson + .lesson { border-top: 1px solid var(--line); }
  .lesson .time { font-family: var(--font-display); font-weight: 600; font-size: 18px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .lesson .who { font-weight: 600; }
  .lesson .meta { font-size: 13px; color: var(--ink-2); }
  .lesson.compact { padding: 10px 16px; }
  .lesson.compact .time { font-size: 15px; }
  .tomorrow { margin-top: 12px; }
  .btn { width: 100%; margin-top: 12px; border: 0; border-radius: 14px; padding: 14px 18px; background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; }
  .btn:active { transform: scale(.985); }

  /* клиенты */
  .segs { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 12px; padding: 2px 16px; scrollbar-width: none; }
  .segs::-webkit-scrollbar { display: none; }
  .seg { flex: none; display: flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-size: 14px; cursor: pointer; white-space: nowrap; }
  .seg .c { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .seg[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .seg[aria-selected="true"] .c { color: var(--accent-ink); opacity: .8; }
  .segsum { font-size: 13px; color: var(--ink-2); margin: 0 0 10px; }
  .search { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); margin-bottom: 10px; }
  .grp { padding: 10px 16px 6px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); background: var(--surface-2); }
  .client { border-top: 1px solid var(--line); }
  .grp + .client { border-top: 0; }
  .client > button { display: grid; grid-template-columns: 1fr auto; gap: 12px; width: 100%; text-align: left; background: none; border: 0; padding: 13px 16px; cursor: pointer; }
  .client .name { font-weight: 600; }
  .client .sub { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .client .due { text-align: right; font-variant-numeric: tabular-nums; }
  .client .due .d { font-weight: 600; }
  .client .due .rel { font-size: 13px; color: var(--ink-2); }
  .client.urgent .due .d { color: var(--warn); }
  .client.late .due .d { color: var(--bad); }
  .bar { display: flex; gap: 3px; margin-top: 7px; flex-wrap: wrap; }
  .bar i { width: 14px; height: 6px; border-radius: 3px; background: var(--used); }
  .bar i.on { background: var(--accent); }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-left: 6px; vertical-align: 1px; }
  .tag.warn { background: var(--warn-soft); color: var(--warn); }
  .tag.bad { background: var(--bad-soft); color: var(--bad); }
  .detail { padding: 0 16px 14px; display: grid; gap: 6px; font-size: 14px; }
  .detail .k { color: var(--ink-2); }
  .detail div { display: flex; justify-content: space-between; gap: 12px; }
  .detail div span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  .back { background: none; border: 0; color: var(--accent); font-weight: 500; padding: 0; margin-bottom: 14px; cursor: pointer; }
  .facts .row { display: flex; justify-content: space-between; gap: 12px; padding: 12px 16px; }
  .facts .row + .row { border-top: 1px solid var(--line); }
  .facts .k { color: var(--ink-2); }
  .facts .v { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
  .note { padding: 13px 16px; display: grid; gap: 4px; }
  .note + .note { border-top: 1px solid var(--line); }
  .note .txt { white-space: pre-wrap; overflow-wrap: anywhere; }
  .note .meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 13px; color: var(--ink-2); }
  .note .del { background: none; border: 0; color: var(--ink-2); padding: 2px 0; cursor: pointer; }
  .note .del.sure { color: var(--bad); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 10px; }
  .chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-size: 14px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  textarea.text { width: 100%; min-height: 84px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); resize: vertical; }
  .hint { font-size: 13px; color: var(--ink-2); margin-top: 8px; }
  .visit { display: flex; justify-content: space-between; padding: 12px 16px; font-variant-numeric: tabular-nums; }
  .visit + .visit { border-top: 1px solid var(--line); }
  .visit .n { color: var(--ink-2); }
  .health { color: var(--warn); font-size: 13px; }
  .pay { display: flex; justify-content: space-between; gap: 12px; padding: 13px 16px; }
  .pay + .pay { border-top: 1px solid var(--line); }
  .pay .s { font-size: 13px; color: var(--ink-2); }
  .pay .r { font-weight: 600; }
</style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">Софья Поленова</div>
    <h1>Сегодня</h1>
    <div class="stamp" id="stamp"></div>
    <div class="sum" id="sum"></div>
  </header>

  <div id="noData" class="list" hidden><div class="empty">Данных нет. Откройте этот экран из бота: меню «Приложение» или команда /clients.</div></div>

  <section id="clientView" hidden style="display:flex;flex-direction:column;gap:22px">
    <div>
      <button class="back" id="cvBack" type="button">‹ Все клиенты</button>
      <h1 id="cvName"></h1>
      <div class="stamp" id="cvSub"></div>
    </div>
    <div class="list facts" id="cvFacts"></div>
    <section>
      <h2>Заметки</h2>
      <div class="list" id="cvNotes"></div>
      <div class="chips" id="cvChips" role="group" aria-label="Тип заметки"></div>
      <textarea class="text" id="cvText" placeholder="Например: болит правое колено, без прыжков" aria-label="Текст заметки"></textarea>
      <button class="btn" id="cvAdd" type="button">Добавить заметку</button>
      <div class="hint" id="cvHint"></div>
    </section>
    <section>
      <h2>Проведённые занятия <span class="cnt" id="cvDoneCnt"></span></h2>
      <div class="list" id="cvDone"></div>
    </section>
    <section>
      <h2>Ближайшие занятия · МСК</h2>
      <div class="list" id="cvNext"></div>
    </section>
  </section>

  <div id="content" hidden style="display:flex;flex-direction:column;gap:26px">
    <section>
      <h2>Занятия сегодня · МСК <span class="cnt" id="todayCnt"></span></h2>
      <div class="list" id="today"></div>
      <button class="btn" id="mark" type="button">Отметить проведённые занятия</button>
      <div class="tomorrow" id="tomorrowBox" hidden>
        <h2>Завтра</h2>
        <div class="list" id="tomorrow"></div>
      </div>
    </section>

    <section>
      <h2>Клиенты · по дате оплаты</h2>
      <div class="segs" id="segs" role="tablist" aria-label="Категории клиентов"></div>
      <div class="segsum" id="segsum"></div>
      <input class="search" id="q" type="search" placeholder="Найти клиента" aria-label="Найти клиента">
      <div class="list" id="all"></div>
    </section>

    <section>
      <h2>Последние оплаты</h2>
      <div class="list" id="pays"></div>
    </section>
  </div>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  var MON_SHORT = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  var DOW = ['вс','пн','вт','ср','чт','пт','сб'];
  var DOW_FULL = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];

  var tg = window.Telegram && window.Telegram.WebApp;
  var inTg = !!(tg && tg.initData);
  if (inTg) {
    try { tg.ready(); tg.expand(); } catch (e) {}
    if (tg.colorScheme) document.documentElement.setAttribute('data-theme', tg.colorScheme);
  }

  function b64bytes(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); });
  }
  async function load() {
    var q = new URLSearchParams(location.search);
    try {
      if (q.get('z')) {
        var stream = new Blob([b64bytes(q.get('z'))]).stream().pipeThrough(new DecompressionStream('deflate'));
        return JSON.parse(await new Response(stream).text());
      }
      if (q.get('d')) return JSON.parse(new TextDecoder().decode(b64bytes(q.get('d'))));
    } catch (e) {}
    return null;
  }

  function plural(n, a, b, c) {
    var m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return a;
    if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return b;
    return c;
  }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function dateOf(iso) { var p = iso.slice(0, 10).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function longDate(iso) { var d = dateOf(iso); return d.getDate() + ' ' + MONTHS[d.getMonth()]; }
  function shortDate(iso) { var d = dateOf(iso); return d.getDate() + ' ' + MON_SHORT[d.getMonth()]; }
  function money(p) { if (String(p || '').indexOf('$') < 0) return 0; var m = String(p).match(/[\d.]+/); return m ? parseFloat(m[0]) : 0; }
  function priceOf(c) { return c.p || c.pr || ''; }
  function tag(text, kind) { return el('span', 'tag' + (kind ? ' ' + kind : ''), text); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function clientTime(iso, c) {
    var off = typeof c.o === 'number' ? c.o : 3;
    if (off === 3) return '';
    var d = new Date(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10), +iso.slice(11, 13) + (off - 3), +iso.slice(14, 16));
    return 'у клиента ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ' ' + (c.z || '');
  }

  // ── заметки: облако Telegram (личное хранилище владельца), запасной вариант — браузер ──
  var CATS = ['Здоровье', 'Травмы', 'Цели', 'Другое'];
  var cloud = inTg && tg.CloudStorage ? tg.CloudStorage : null;
  var notes = {};
  function loadNotes(cb) {
    if (cloud) {
      cloud.getKeys(function (err, keys) {
        keys = (keys || []).filter(function (k) { return k.indexOf('n_') === 0; });
        if (err || !keys.length) return cb({});
        cloud.getItems(keys, function (err2, vals) {
          var out = {};
          if (!err2 && vals) keys.forEach(function (k) { try { out[k.slice(2)] = JSON.parse(vals[k]); } catch (e) {} });
          cb(out);
        });
      });
    } else {
      try { cb(JSON.parse(localStorage.getItem('sofia_notes') || '{}')); } catch (e) { cb({}); }
    }
  }
  function saveNotes(key, cb) {
    var arr = notes[key] || [];
    if (cloud) {
      var done = function (err) { cb(!err); };
      if (arr.length) cloud.setItem('n_' + key, JSON.stringify(arr), done); else cloud.removeItem('n_' + key, done);
    } else {
      try { localStorage.setItem('sofia_notes', JSON.stringify(notes)); cb(true); } catch (e) { cb(false); }
    }
  }
  var healthNote = function (c) {
    var list = (notes[c.k] || []).filter(function (n) { return n.c === 'Здоровье'; });
    return list.length ? list[list.length - 1].t : '';
  };

  var view = 'main';
  var fromApp = /[?&]from=app/.test(location.search);
  function goBack() {
    if (view === 'client') showMain(); else if (fromApp) history.back();
  }
  if (inTg) {
    try { tg.onEvent('backButtonClicked', goBack); } catch (e) {}
  }
  function syncBackButton() {
    if (!inTg) return;
    try { if (view === 'client' || fromApp) tg.BackButton.show(); else tg.BackButton.hide(); } catch (e) {}
  }

  var SEGMENTS = [['p', 'Личная работа'], ['g', 'Групповые'], ['r', 'Программа'], ['c', 'Клуб']];
  var seg = 'p';
  try { seg = localStorage.getItem('sofia_seg') || 'p'; } catch (e) {}
  var segOf = function (c) { return c.cg || 'p'; };
  var data, clients, daysTo, todayD;
  var selected = null, cat = 'Здоровье';

  function showMain() {
    view = 'main';
    $('clientView').hidden = true;
    $('content').hidden = false;
    renderToday(); renderClients($('q').value);
    syncBackButton();
    window.scrollTo(0, 0);
  }
  function showClient(c) {
    view = 'client'; selected = c;
    $('content').hidden = true;
    $('clientView').hidden = false;
    renderClientView();
    syncBackButton();
    window.scrollTo(0, 0);
  }

  function lessonRow(it, compact) {
    var r = el('div', 'lesson' + (compact ? ' compact' : ''));
    r.appendChild(el('div', 'time', it.iso.slice(11, 16)));
    var mid = el('div');
    var who = el('div', 'who', it.c.n);
    if (it.from) who.appendChild(tag('перенос', 'warn'));
    mid.appendChild(who);
    var meta = [];
    var ct = clientTime(it.iso, it.c);
    if (ct) meta.push(ct);
    meta.push('осталось ' + it.c.l + ' ' + plural(it.c.l, 'занятие', 'занятия', 'занятий'));
    if (it.from) meta.push('было ' + dateOf(it.from).getDate() + ' ' + MON_SHORT[dateOf(it.from).getMonth()] + ' ' + it.from.slice(11, 16));
    mid.appendChild(el('div', 'meta', meta.join(' · ')));
    var hn = healthNote(it.c);
    if (hn) mid.appendChild(el('div', 'health', '⚠ ' + (hn.length > 60 ? hn.slice(0, 60) + '…' : hn)));
    r.appendChild(mid);
    r.style.cursor = 'pointer';
    r.addEventListener('click', function () { showClient(it.c); });
    return r;
  }

  function renderToday() {
    var todayL = [], tomorrowL = [];
    data.c.forEach(function (c) {
      (c.x || []).forEach(function (it) {
        var diff = daysTo(it[0]);
        var item = { iso: it[0], from: it[1], c: c };
        if (diff === 0) todayL.push(item); else if (diff === 1) tomorrowL.push(item);
      });
    });
    var byTime = function (a, b) { return a.iso < b.iso ? -1 : 1; };
    todayL.sort(byTime); tomorrowL.sort(byTime);
    var tBox = $('today'); tBox.innerHTML = '';
    if (!todayL.length) tBox.appendChild(el('div', 'empty', 'Сегодня занятий нет.'));
    todayL.forEach(function (it) { tBox.appendChild(lessonRow(it, false)); });
    $('todayCnt').textContent = todayL.length ? '· ' + todayL.length : '';
    $('mark').hidden = !todayL.length;
    var tm = $('tomorrow'); tm.innerHTML = '';
    $('tomorrowBox').hidden = !tomorrowL.length;
    tomorrowL.forEach(function (it) { tm.appendChild(lessonRow(it, true)); });
    var s1 = $('sum'); s1.innerHTML = '';
    var soon = clients.filter(function (c) { return c.e && daysTo(c.e) <= 7; });
    var soonSum = soon.reduce(function (s, c) { return s + money(c.p); }, 0);
    var a = el('span'); a.innerHTML = 'Занятий сегодня: <b>' + todayL.length + '</b>'; s1.appendChild(a);
    var b = el('span'); b.innerHTML = 'Оплат за 7 дней: <b>' + soon.length + (soonSum ? ' · $' + soonSum : '') + '</b>'; s1.appendChild(b);
  }

  function renderClients(filter) {
    var allBox = $('all'); allBox.innerHTML = '';
    var f = (filter || '').trim().toLowerCase();
    var shown = clients.filter(function (c) { return f ? c.n.toLowerCase().indexOf(f) >= 0 : segOf(c) === seg; });
    renderSegs(!!f);
    if (!shown.length) { allBox.appendChild(el('div', 'empty', f ? 'Никого не нашла.' : 'В этой категории пока никого.')); return; }
    var lastGroup = null;
    shown.forEach(function (c) {
      var d = c.e ? daysTo(c.e) : null;
      var group = d === null ? 'Срок не задан' : d < 0 ? 'Просрочено' : d <= 7 ? 'Ближайшие 7 дней' : d <= 31 ? 'В течение месяца' : 'Позже';
      if (group !== lastGroup) { allBox.appendChild(el('div', 'grp', group)); lastGroup = group; }
      var wrap = el('div', 'client' + (d !== null && d < 0 ? ' late' : d !== null && d <= 7 ? ' urgent' : ''));
      var btn = el('button'); btn.type = 'button';
      var left = el('div');
      var name = el('div', 'name', c.n);
      if (healthNote(c)) name.appendChild(tag('здоровье', 'warn'));
      if (!c.b) name.appendChild(tag('не в боте', 'warn'));
      if (c.pd) name.appendChild(tag('ждёт даты', 'warn'));
      left.appendChild(name);
      left.appendChild(el('div', 'sub', subText(c)));
      if (c.t) {
        var bar = el('div', 'bar');
        for (var i = 0; i < c.t; i++) bar.appendChild(el('i', i >= c.t - c.l ? 'on' : ''));
        left.appendChild(bar);
      }
      var due = el('div', 'due');
      due.appendChild(el('div', 'd', (c.e ? shortDate(c.e) : '—') + (priceOf(c) ? ' · ' + priceOf(c) : '')));
      due.appendChild(el('div', 'rel', d === null ? 'нет даты' : d < 0 ? 'просрочено на ' + (-d) + ' дн.' : d === 0 ? 'сегодня' : 'через ' + d + ' ' + plural(d, 'день', 'дня', 'дней')));
      btn.appendChild(left); btn.appendChild(due);
      btn.addEventListener('click', function () { showClient(c); });
      wrap.appendChild(btn);
      allBox.appendChild(wrap);
    });
  }

  function subText(c) {
    if (c.l != null) return 'осталось ' + c.l + ' из ' + c.t + ' · до ' + shortDate(c.u);
    return (c.f || 'абонемент') + (c.u ? ' · до ' + shortDate(c.u) : '');
  }
  function renderSegs(searching) {
    var box = $('segs'); box.innerHTML = '';
    SEGMENTS.forEach(function (sg) {
      var n = clients.filter(function (c) { return segOf(c) === sg[0]; }).length;
      var b = el('button', 'seg'); b.type = 'button'; b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', String(!searching && seg === sg[0]));
      b.appendChild(document.createTextNode(sg[1]));
      b.appendChild(el('span', 'c', String(n)));
      b.addEventListener('click', function () {
        seg = sg[0];
        try { localStorage.setItem('sofia_seg', seg); } catch (e) {}
        $('q').value = '';
        renderClients('');
      });
      box.appendChild(b);
    });
    var list = clients.filter(function (c) { return searching || segOf(c) === seg; });
    var soon = list.filter(function (c) { return c.e && daysTo(c.e) <= 7; });
    var sum = soon.reduce(function (t, c) { return t + money(c.p); }, 0);
    $('segsum').textContent = searching ? 'Поиск по всем категориям' :
      list.length + ' ' + plural(list.length, 'клиент', 'клиента', 'клиентов') + ' · оплат за 7 дней: ' + soon.length + (sum ? ' · $' + sum : '');
  }
  function fact(box, k, v) { var r = el('div', 'row'); r.appendChild(el('span', 'k', k)); r.appendChild(el('span', 'v', v)); box.appendChild(r); }

  function renderNotes() {
    var box = $('cvNotes'); box.innerHTML = '';
    var list = notes[selected.k] || [];
    if (!list.length) { box.appendChild(el('div', 'empty', 'Заметок пока нет.')); return; }
    list.slice().reverse().forEach(function (n) {
      var row = el('div', 'note');
      var top = el('div', 'meta');
      var l = el('span'); l.appendChild(tag(n.c, n.c === 'Здоровье' || n.c === 'Травмы' ? 'warn' : '')); l.appendChild(document.createTextNode(' ' + longDate(n.d)));
      top.appendChild(l);
      var del = el('button', 'del', 'Удалить'); del.type = 'button';
      del.addEventListener('click', function () {
        if (!del.classList.contains('sure')) { del.classList.add('sure'); del.textContent = 'Точно удалить?'; return; }
        var i = notes[selected.k].indexOf(n);
        if (i >= 0) notes[selected.k].splice(i, 1);
        saveNotes(selected.k, function (ok) { $('cvHint').textContent = ok ? '' : 'Не получилось удалить, попробуйте ещё раз.'; renderNotes(); });
      });
      top.appendChild(del);
      row.appendChild(el('div', 'txt', n.t));
      row.appendChild(top);
      box.appendChild(row);
    });
  }

  function renderClientView() {
    var c = selected;
    $('cvName').textContent = c.n;
    $('cvSub').textContent = c.l != null ? 'осталось ' + c.l + ' из ' + c.t + ' · пояс ' + (c.z || 'МСК') : (c.f || 'абонемент');
    var facts = $('cvFacts'); facts.innerHTML = '';
    var d = c.e ? daysTo(c.e) : null;
    if (c.f && c.l != null) fact(facts, 'Формат', c.f);
    if (d !== null) {
      fact(facts, 'Оплата ожидается', shortDate(c.e) + (priceOf(c) ? ' · ' + priceOf(c) : '') + (d < 0 ? ' (просрочена)' : d === 0 ? ' (сегодня)' : ' (через ' + d + ' ' + plural(d, 'день', 'дня', 'дней') + ')'));
      fact(facts, 'Причина', c.er === 'l' ? 'кончаются занятия' : 'кончается срок');
    } else {
      fact(facts, 'Оплата ожидается', 'дата не задана');
      if (priceOf(c)) fact(facts, 'Стоимость', priceOf(c));
    }
    if (c.u) fact(facts, 'Абонемент до', longDate(c.u));
    if (c.nt) fact(facts, 'Из таблицы', c.nt);
    fact(facts, 'Последняя оплата', c.lp ? longDate(c.lp) : 'через бота не было');
    fact(facts, 'В боте', c.b ? 'да' : 'не открывал');

    renderNotes();
    var chips = $('cvChips'); chips.innerHTML = '';
    CATS.forEach(function (name) {
      var b = el('button', 'chip', name); b.type = 'button';
      b.setAttribute('aria-pressed', String(name === cat));
      b.addEventListener('click', function () { cat = name; renderClientView(); });
      chips.appendChild(b);
    });
    $('cvHint').textContent = cloud ? 'Заметки видите только вы, они хранятся в вашем Telegram.' : 'В браузере заметки сохраняются только на этом устройстве.';

    var done = c.dn || [];
    $('cvDoneCnt').textContent = c.dc ? '· ' + c.dc : '';
    var dBox = $('cvDone'); dBox.innerHTML = '';
    if (!done.length) dBox.appendChild(el('div', 'empty', 'Проведённых занятий бот пока не записал. Прошлые даты можно добавить командой /history.'));
    done.slice().reverse().forEach(function (iso, i) {
      var dd = dateOf(iso);
      var r = el('div', 'visit');
      r.appendChild(el('span', null, DOW[dd.getDay()] + ', ' + dd.getDate() + ' ' + MONTHS[dd.getMonth()] + ' ' + dd.getFullYear()));
      r.appendChild(el('span', 'n', '№ ' + (c.dc - i)));
      dBox.appendChild(r);
    });
    if (c.dc > done.length) dBox.appendChild(el('div', 'empty', 'Показаны последние ' + done.length + ' из ' + c.dc + '.'));

    var nBox = $('cvNext'); nBox.innerHTML = '';
    if (!(c.x || []).length) nBox.appendChild(el('div', 'empty', 'Расписание не задано.'));
    (c.x || []).forEach(function (it) {
      var dd = dateOf(it[0]);
      var r = el('div', 'visit');
      var l = el('span', null, DOW[dd.getDay()] + ', ' + dd.getDate() + ' ' + MONTHS[dd.getMonth()] + ' · ' + it[0].slice(11, 16));
      if (it[1]) l.appendChild(tag('перенос', 'warn'));
      r.appendChild(l);
      r.appendChild(el('span', 'n', clientTime(it[0], c)));
      nBox.appendChild(r);
    });
  }

  $('cvBack').addEventListener('click', showMain);
  $('cvAdd').addEventListener('click', function () {
    var text = $('cvText').value.trim();
    if (!text || !selected) return;
    var key = selected.k;
    notes[key] = notes[key] || [];
    var note = { t: text, c: cat, d: data.g };
    notes[key].push(note);
    saveNotes(key, function (ok) {
      if (!ok) { notes[key].pop(); $('cvHint').textContent = 'Не сохранилось: слишком много заметок или нет связи.'; return; }
      $('cvText').value = '';
      renderClientView();
    });
  });
  $('mark').addEventListener('click', function () {
    var link = 'https://t.me/SofiaPolenova_bot?start=day';
    if (inTg && tg.openTelegramLink) tg.openTelegramLink(link); else window.open(link, '_blank');
  });
  $('q').addEventListener('input', function () { renderClients(this.value); });

  load().then(function (d) {
    if (!d || !d.c) { $('noData').hidden = false; return; }
    data = d;
    todayD = dateOf(d.g);
    daysTo = function (iso) { return Math.round((dateOf(iso) - todayD) / 864e5); };
    var dueDays = function (c) { return c.e ? daysTo(c.e) : 99999; };
    clients = d.c.slice().sort(function (a, b) { return dueDays(a) - dueDays(b) || (a.l == null ? 99 : a.l) - (b.l == null ? 99 : b.l); });
    $('stamp').textContent = DOW_FULL[todayD.getDay()] + ', ' + todayD.getDate() + ' ' + MONTHS[todayD.getMonth()];
    if (!clients.some(function (c) { return segOf(c) === seg; })) {
      var first = SEGMENTS.filter(function (sg) { return clients.some(function (c) { return segOf(c) === sg[0]; }); })[0];
      if (first) seg = first[0];
    }
    var pays = $('pays');
    if (!d.h || !d.h.length) pays.appendChild(el('div', 'empty', 'Оплат через бота пока нет.'));
    (d.h || []).forEach(function (h) {
      var r = el('div', 'pay'), l = el('div');
      l.appendChild(el('div', null, h.n));
      l.appendChild(el('div', 's', longDate(h.d) + ' · +' + h.a + ' ' + plural(h.a, 'занятие', 'занятия', 'занятий') + ' · до ' + longDate(h.u)));
      r.appendChild(l); r.appendChild(el('div', 'r', h.p || ''));
      pays.appendChild(r);
    });
    showMain();
    loadNotes(function (n) { notes = n || {}; if (view === 'main') { renderToday(); renderClients($('q').value); } });
  });
})();
</script>
</body>
</html>
